name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract and locate project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path './.git/*' \
            -not -path './_project/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -maxdepth 4 -type f \
              -name '*.zip' \
              -not -path './_project/*' | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "::error::ไม่พบ ZIP โปรเจกต์ใน GitHub Repository"
              exit 1
            fi

            mkdir -p _project
            unzip -q "$ZIP" -d _project

            SETTINGS=$(find _project -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              | head -n 1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::ไม่พบ Gradle settings file"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicLiveWallpaper-V2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
